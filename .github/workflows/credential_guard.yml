name: Credential Guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  reject-service-account-keys:
    name: Reject tracked service-account keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-no-service-account-keys.mjs
      - name: Prove the guard rejects keystores and google-services.json (negative test)
        run: node --test scripts/verify-no-service-account-keys.test.mjs
