name: Foundation Gate CI

on:
  workflow_dispatch:
  push:
    paths:
      - "app/lib/foundation_gate/**"
      - "app/test/foundation_gate/**"
      - "app/pubspec.yaml"
      - "app/pubspec.lock"
      - "app/analysis_options.yaml"
      - ".github/workflows/foundation_gate_ci.yml"
  pull_request:
    paths:
      - "app/lib/foundation_gate/**"
      - "app/test/foundation_gate/**"
      - "app/pubspec.yaml"
      - "app/pubspec.lock"
      - "app/analysis_options.yaml"
      - ".github/workflows/foundation_gate_ci.yml"

permissions:
  contents: read

concurrency:
  group: foundation-gate-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-foundation-gate:
    name: Isolated Foundation Gate tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Generate localization source
        run: flutter gen-l10n
      - name: Analyze isolated gate
        id: analyze
        continue-on-error: true
        run: |
          mkdir -p build/ci
          set -o pipefail
          flutter analyze --fatal-infos lib/foundation_gate test/foundation_gate 2>&1 | tee build/ci/foundation-gate-analyze.txt
      - name: Run isolated gate tests
        if: steps.analyze.outcome == 'success'
        run: flutter test test/foundation_gate
      - name: Enforce isolated analysis gate
        if: always() && steps.analyze.outcome == 'failure'
        run: |
          summary=$(tr '\n' ' ' < build/ci/foundation-gate-analyze.txt | cut -c1-4000)
          echo "::error title=Isolated Flutter analyzer::${summary}"
          exit 1
