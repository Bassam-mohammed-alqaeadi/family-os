name: Flutter CI

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/flutter_ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/flutter_ci.yml"

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Generate localization source
        run: flutter gen-l10n
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          mkdir -p build/ci
          set -o pipefail
          flutter analyze --fatal-infos 2>&1 | tee build/ci/flutter-analyze.txt
      - name: Run tests
        if: steps.analyze.outcome == 'success'
        id: tests
        continue-on-error: true
        run: |
          mkdir -p build/ci
          # The JSON report carries names and results, and the exception text goes to the
          # console. Both are kept, because a failure named without its message cannot be
          # acted on from a machine that can only read annotations.
          flutter test --file-reporter=json:build/ci/flutter-test.json 2>&1 | tee build/ci/flutter-test.log
      - name: Summarize test result
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path("build/ci/flutter-test.json")
          names = {}
          errors = {}
          failures = []

          def describe(value):
              if isinstance(value, dict):
                  return value.get("message") or value.get("error") or json.dumps(value, ensure_ascii=False)
              return str(value or "")

          if report.exists():
              for raw in report.read_text(encoding="utf-8").splitlines():
                  try:
                      event = json.loads(raw)
                  except json.JSONDecodeError:
                      continue
                  if event.get("type") == "testStart":
                      test = event.get("test", {})
                      names[str(test.get("id", ""))] = test.get("name", "unnamed test")
                  if event.get("type") == "error":
                      test_id = str(event.get("testID", ""))
                      errors.setdefault(test_id, []).append(describe(event.get("error") or event.get("message")))
                  if event.get("type") == "testDone" and event.get("result") not in ("success", "skipped"):
                      test = event.get("test", {})
                      test_id = str(event.get("testID", test.get("id", "")))
                      name = test.get("name") or names.get(test_id, "unnamed test")
                      detail = (
                          event.get("reason")
                          or event.get("message")
                          or event.get("error")
                          or " ".join(errors.get(test_id, []))
                      )
                      failures.append((name, describe(detail).replace("\n", " ")[:500]))

          def markdown_cell(value):
              return value.replace("|", "\\|")

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = ["## Flutter test result", ""]
          if os.environ["TEST_OUTCOME"] == "success":
              lines.append("✅ `flutter test` passed.")
          elif failures:
              lines.extend([
                  f"❌ `flutter test` failed: **{len(failures)}** failing test(s).",
                  "",
                  "| Test | Failure summary |",
                  "| --- | --- |",
              ])
              for name, detail in failures:
                  lines.append(f"| `{markdown_cell(name)}` | {markdown_cell(detail)} |")
              for start in range(0, len(failures), 5):
                  end = min(start + 5, len(failures))
                  annotation = " | ".join(
                      f"{index}. {name}: {detail}"
                      for index, (name, detail) in enumerate(
                          failures[start:end],
                          start + 1,
                      )
                  )
                  print(
                      f"::error title=Flutter test failures {start + 1}-{end}::"
                      f"{annotation}"
                  )
          else:
              lines.append(
                  "❌ `flutter test` failed, but no structured failure report was produced. "
                  "Inspect the Run tests log."
              )
          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          # Surface each failure through the workflow command channel as well. The step
          # summary lives in the UI, and the log file sits behind a signed link, so a
          # failure that is only in those two places cannot be read by an agent that
          # needs to fix it. An annotation is retrievable through the checks API, which
          # is how the next commit learns what actually broke instead of guessing.
          for failure in failures:
              message = failure if isinstance(failure, str) else str(failure)
              print(f"::error title=Flutter test failed::{message[:900]}")
          for name, error in errors.items():
              print(f"::error title=Flutter test error::{name}: {str(error)[:800]}")

          # The exception text itself, which the JSON reporter does not carry. Flutter
          # wraps the matcher description over several lines, so a block runs from
          # "Expected:" until the next line that starts in column zero - collecting one
          # line per match is how the key name in "Found 0 widgets with key [<...>]" ended
          # up missing from the previous run's annotation.
          console = Path("build/ci/flutter-test.log")
          # Only on a real failure. Annotations that fire on green runs train everyone to
          # ignore them, which is how a real failure gets missed.
          if console.exists() and failures:
              raw = console.read_text(encoding="utf-8", errors="replace").splitlines()
              blocks = []
              current = None
              for line in raw:
                  if line.startswith("Expected:") or line.strip().startswith("Expected:"):
                      if current:
                          blocks.append(" ".join(current))
                      current = [line.strip()]
                      continue
                  if current is not None:
                      if line.strip() == "":
                          blocks.append(" ".join(current))
                          current = None
                          continue
                      # A stack frame or a new section ends the block.
                      if line.startswith("#") or line.startswith("package:") or line.startswith("test/"):
                          blocks.append(" ".join(current))
                          current = None
                          continue
                      current.append(line.strip())
              if current:
                  blocks.append(" ".join(current))
              for block in blocks[:12]:
                  print(f"::error title=Flutter expectation::{block[:1100]}")

              # A tail as well: if the structured pass misses a shape the reporter uses,
              # the console still says why it failed. Escaped to one line, because a
              # workflow command cannot carry a raw newline.
              tail = " \u23ce ".join(
                  line.rstrip() for line in raw[-60:] if line.strip()
              )
              print(f"::error title=Flutter console tail::{tail[-1200:]}")
          PY
      - name: Upload Flutter test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-report-${{ github.run_id }}
          path: app/build/ci/flutter-test.json
          if-no-files-found: warn
          retention-days: 7
      - name: Verify generated source is committed
        id: generated
        if: always()
        run: |
          if git diff --quiet -- \
            lib/app/router.dart \
            lib/app/shell_config.dart \
            lib/core/i18n; then
            echo "Generated source is committed and current."
          else
            # The diff itself is the only thing that says WHAT is stale, and the job log
            # is not readable from every environment that has to fix it. Truncated to keep
            # the annotation within the API's limit; the log still has all of it.
            DIFF="$(git diff -- lib/app/router.dart lib/app/shell_config.dart lib/core/i18n \
              | head -c 55000)"
            ESCAPED="$(printf '%s' "$DIFF" | sed -e 's/%/%25/g' -e 's/\r//g' | tr '\n' '\036' | sed -e 's/\036/%0A/g')"
            echo "::error title=Generated source is stale::${ESCAPED}"
            git diff --stat -- lib/app/router.dart lib/app/shell_config.dart lib/core/i18n
            exit 1
          fi
      - name: Enforce analyzer, test and generated-source gates
        if: always() && (steps.analyze.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.generated.outcome == 'failure')
        run: |
          if [ "${{ steps.analyze.outcome }}" = 'failure' ]; then
            summary=$(tr '\n' ' ' < build/ci/flutter-analyze.txt | cut -c1-4000)
            echo "::error title=Flutter analyzer::${summary:-flutter analyze failed; inspect build/ci/flutter-analyze.txt}"
          fi
          exit 1
