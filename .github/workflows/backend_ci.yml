name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend_ci.yml'
  push:
    branches:
      - main
      - arena/**
    paths:
      - 'backend/**'
      - '.github/workflows/backend_ci.yml'

permissions:
  contents: read

jobs:
  foundation-api:
    name: Foundation API contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
