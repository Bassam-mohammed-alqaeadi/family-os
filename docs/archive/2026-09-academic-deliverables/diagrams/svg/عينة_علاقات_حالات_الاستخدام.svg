<circle cx="150" cy="290" r="14"/><line x1="150" y1="304" x2="150" y2="345"/><line x1="128" y1="318" x2="172" y2="318"/><line x1="150" y1="345" x2="132" y2="375"/><line x1="150" y1="345" x2="168" y2="375"/>
<circle cx="70" cy="480" r="14"/><line x1="70" y1="494" x2="70" y2="535"/><line x1="48" y1="508" x2="92" y2="508"/><line x1="70" y1="535" x2="52" y2="565"/><line x1="70" y1="535" x2="88" y2="565"/>
