<ellipse cx="450" cy="150" rx="110" ry="36" fill="#E7F7EE"/>
<ellipse cx="780" cy="150" rx="118" ry="36" fill="#FFF6E0"/>
<ellipse cx="455" cy="320" rx="122" ry="38" fill="#E7F7EE"/>
